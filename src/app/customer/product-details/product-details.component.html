<div class="container">
    <mat-toolbar>
        <span>{{productDetails?.title}}</span>
    </mat-toolbar>
  
    <div class="box-container">
  
        <div class="box">
            <img src="{{productDetails?.image}}" alt="">
            <h2>Цена: {{productDetails?.price}}₽</h2>
            <!-- <div style="padding-left: 41%;">Color: <h3 [style.backgroundColor]="productDetails?.color" class="product-color"></h3>
            </div> -->
            
            <p>Категория: {{productDetails?.categories}}</p>
            <p>{{productDetails?.desc}}</p>
            <div>
                <button mat-raised-button (click)="addToCart()" *ngIf="!removeCartLink" class="btn">В корзину</button>
                <button mat-raised-button (click)="removeFromCart()" *ngIf="removeCartLink" class="btn">Удалить из корзины</button>
                <button mat-raised-button (click)="buyNow()" *ngIf="!removeCartLink" color="primary" class="btn">Купить сейчас</button>
                <button mat-raised-button routerLink="/cart"  *ngIf="removeCartLink" color="primary" class="btn">Открыть корзину</button>
                <!-- <a (click)="addToCart()" *ngIf="!removeCartLink" class="btn" style="background: #de7906;">В корзину</a>&nbsp;
                <a (click)="removeFromCart()" *ngIf="removeCartLink" class="btn" style="background: #de7906;">Удалить из корзины</a>&nbsp;
                <a (click)="buyNow()" *ngIf="!removeCartLink" class="btn">Купить сейчас</a>
                <a routerLink="/cart" *ngIf="removeCartLink" class="btn">Открыть корзину</a> -->
            </div>
            <!-- <div class="quantity-group" *ngIf="!removeCartLink">
                <button (click)="handleQuantity('min')">-</button>
                <input type="text" value="{{productQuantity}}">
                <button (click)="handleQuantity('plus')">+</button>
            </div> -->
        </div>
  
    </div>
  
  </div>
