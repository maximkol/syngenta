<div class="container">
    <mat-toolbar>
        <span>Семена и средства защиты растений</span>
    </mat-toolbar>
    <div class="box-container">
  
        <div class="box"  *ngFor="let item of shopProducts">
            <img src="{{item.image}}" routerLink="/product-details/{{item._id}}">
            <h3>{{item.title}}</h3>
            <p>Цена: {{item.price}}₽</p>
            <a routerLink="/product-details/{{item._id}}" class="btn">Подробнее</a>
        </div>
  
    </div>
  
  </div>
